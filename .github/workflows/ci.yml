name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.15.7
      - name: ruff format
        run: ruff format --check .
      - name: ruff check
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: hooks/catalog.ts is in sync with models.json
        run: python tools/sync_catalog.py --check
      - name: Package the skill
        run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: adv-skill
          path: dist/adv-skill.zip

  plugin:
    runs-on: ubuntu-latest
    # Validation needs no login or API key, but the installer and the validator are
    # outside this repo's control, so a failure here should not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin and marketplace
        run: claude plugin validate . --strict

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the skill
        run: python tools/package_skill.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/adv-skill.zip
